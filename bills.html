<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pay Bills</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
  <h2>💳 Fast &amp; Reliable Bank</h2>
  <div style="display:flex;align-items:center;gap:8px;">
    <img id="userAvatar" class="avatar" alt="Profile" style="display:none" src="">
    <span id="userDisplay"></span>
    <a class="interfaces-link" href="interfaces.html" title="All Interfaces" aria-label="All Interfaces" style="margin-left:8px;text-decoration:none;display:inline-flex;align-items:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M12 7l3 2-2 3-3-2 2-3z" fill="currentColor"/>
      </svg>
    </a>
  </div>
  </header>

  <main class="center">
    <section>
      <h2>Pay Bills</h2>
      <p>Select bill type and provider</p>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <div style="font-weight:600">Providers</div>
        <button id="toggleBillers" class="btn-ghost mobile-only" title="Hide providers">Hide ▾</button>
      </div>
      <div id="billerPanel" class="recent-panel">
        <div class="biller-grid" id="billerGrid">
          <!-- biller tiles populated by script -->
        </div>
      </div>
      <div class="form-row">
        <input id="bill_ref" placeholder="Customer / meter / account number">
        <input id="bill_amount" type="number" placeholder="Amount">
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:12px">
        <button id="btnBill" class="primary">Pay Bill</button>
      </div>
      <p style="text-align:center;margin-top:12px"><a href="index.html">← Back</a></p>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.checkAuth) window.checkAuth();
      if (window.loadUser) window.loadUser();
      if (window.loadProfile) window.loadProfile();
      try { if (window.populateBillers) window.populateBillers('billerGrid'); } catch(e){}
      document.getElementById('btnBill')?.addEventListener('click', () => window.payBill && window.payBill());

      // mobile toggle for biller providers
      (function(){
        const btn = document.getElementById('toggleBillers');
        const panel = document.getElementById('billerPanel');
        if (!btn || !panel) return;
        const THRESH = 780;
        const stored = localStorage.getItem('bt_billers_collapsed');
        function apply(c){ if (c) panel.classList.add('collapsed'); else panel.classList.remove('collapsed'); btn.innerText = c ? 'Show ▸' : 'Hide ▾'; }
        if (stored !== null) apply(stored === '1'); else apply(window.innerWidth < THRESH);
        btn.addEventListener('click', ()=>{ const collapsed = panel.classList.toggle('collapsed'); btn.innerText = collapsed ? 'Show ▸' : 'Hide ▾'; localStorage.setItem('bt_billers_collapsed', collapsed ? '1' : '0'); });
      })();
    });
  </script>
</body>
</html>
