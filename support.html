<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support — Fast &amp; Reliable Bank</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h2>🆘 Support</h2>
  <div style="display:flex;align-items:center;gap:8px;">
    <img id="userAvatar" class="avatar" alt="Profile" style="display:none" src="">
    <span id="userDisplay"></span>
    <a class="interfaces-link" href="interfaces.html" title="All Interfaces" aria-label="All Interfaces" style="margin-left:8px;text-decoration:none;display:inline-flex;align-items:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M12 7l3 2-2 3-3-2 2-3z" fill="currentColor"/>
      </svg>
    </a>
  </div>
  </header>

  <main class="center">
    <section>
      <h3>Contact Support</h3>
      <p>If you have an issue with your account, transaction, or the app, send us a message and our team will respond.</p>

  <div class="support-form card-surface">
        <label for="s_name">Your name</label>
        <input id="s_name" placeholder="Your full name">

        <label for="s_email">Email (optional)</label>
        <input id="s_email" placeholder="you@example.com">

        <label for="s_subject">Subject</label>
        <input id="s_subject" placeholder="Short summary of your issue">

        <label for="s_category">Category</label>
        <select id="s_category">
          <option>Account</option>
          <option>Transaction</option>
          <option>Technical</option>
          <option>Security</option>
          <option>Other</option>
        </select>

        <label for="s_priority">Priority</label>
        <select id="s_priority">
          <option>Normal</option>
          <option>Low</option>
          <option>High</option>
        </select>

        <label for="s_message">Message</label>
        <textarea id="s_message" rows="6" placeholder="Describe the issue with as many details as you can"></textarea>

        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
          <button id="btnSupportSubmit">Send to Support</button>
          <button id="btnSupportCancel" style="background:transparent;color:var(--muted);border:1px solid rgba(0,0,0,0.06)">Cancel</button>
        </div>
      </div>
    </section>

    <section>
      <h3>Previously submitted</h3>
      <div id="supportList">Loading…</div>
    </section>
  </main>

  <!-- Chat widget launcher + modal -->
  <button id="openChatBtn" class="chat-launch">💬 Chat with support</button>

  <div id="chatWidget" class="chat-widget" aria-hidden="true">
    <div class="chat-header">
      <strong>Support Chat</strong>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button id="btnNewTicket" title="Create ticket" style="font-size:0.9rem;padding:6px">✉️</button>
        <button id="btnCloseChat" title="Close chat" style="font-size:1rem;padding:6px">✖</button>
      </div>
    </div>
    <div id="chatMessages" class="chat-messages">Loading…</div>
    <div class="chat-input">
      <input id="chatInputField" placeholder="Describe your issue or ask the help bot...">
      <button id="chatSendBtn">Send</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 11.5L12 4l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11.5z" fill="currentColor"/></svg></span></a>
    <a href="locations.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2C8 6 6 9.5 6 12.5 6 16 9 20 12 22c3-2 6-6 6-9.5C18 9.5 16 6 12 2z" fill="currentColor"/></svg></span></a>
    <a href="send.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z" fill="currentColor"/></svg></span></a>
    <a href="report.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 22a2 2 0 0 0 2-2H10a2 2 0 0 0 2 2zm6-6V11c0-3.3-2.1-6.1-5-6.8V3a1 1 0 1 0-2 0v1.2C8.1 4.9 6 7.7 6 11v5l-2 2v1h16v-1l-2-2z" fill="currentColor"/></svg></span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z" fill="currentColor"/></svg></span></a>
    <a href="#" onclick="logout()" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8v2h8v14h-8v2h8a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1z" fill="currentColor"/></svg></span></a>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.checkAuth) window.checkAuth(false);
      if (window.loadUser) window.loadUser();
      if (window.loadProfile) window.loadProfile();

      // Prefill name/email if profile exists
      try {
        const user = localStorage.getItem('loggedInUser');
        const profiles = JSON.parse(localStorage.getItem('bt_profiles') || '{}');
        const p = profiles[user] || {};
        if (p && p.displayName) document.getElementById('s_name').value = p.displayName;
        if (p && p.email) document.getElementById('s_email').value = p.email;
      } catch (e) { /* ignore */ }

      document.getElementById('btnSupportSubmit')?.addEventListener('click', () => {
        if (window.createSupportTicket) return window.createSupportTicket();
        showToast('Support handler not available', 'danger');
      });

      document.getElementById('btnSupportCancel')?.addEventListener('click', () => {
        window.location.href = 'dashboard.html';
      });

      // Chat widget buttons
      document.getElementById('openChatBtn')?.addEventListener('click', () => { if (window.openSupportChat) window.openSupportChat(); document.getElementById('chatWidget')?.setAttribute('aria-hidden','false'); });
      document.getElementById('btnCloseChat')?.addEventListener('click', () => { if (window.closeSupportChat) window.closeSupportChat(); document.getElementById('chatWidget')?.setAttribute('aria-hidden','true'); });
      document.getElementById('chatSendBtn')?.addEventListener('click', () => { if (window.sendSupportChat) window.sendSupportChat(); });
      document.getElementById('chatInputField')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (window.sendSupportChat) window.sendSupportChat(); } });
      document.getElementById('btnNewTicket')?.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); document.getElementById('s_subject')?.focus(); });

      // render list
      function renderList() {
        const container = document.getElementById('supportList');
        const tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]').reverse();
  if (!tickets.length) return container.innerHTML = '<p style="color:var(--muted)">No support requests yet.</p>';
        container.innerHTML = tickets.map(t => {
          const when = new Date(t.time).toLocaleString();
          return `
            <div class="ticket">
              <div class="t-title">${escapeHtml(t.subject)}</div>
              <div class="t-meta">${escapeHtml(t.priority)} · ${escapeHtml(t.category)} · <span style="opacity:0.8">${when}</span></div>
              <div class="t-body">${escapeHtml(t.message).slice(0,400)}</div>
              <div class="t-meta" style="margin-top:8px;color:var(--muted)">${escapeHtml(t.reporter || t.name)} • status: ${escapeHtml(t.status || 'open')}</div>
            </div>
          `;
        }).join('');
      }

      // small helper to avoid XSS when inserting tickets
      function escapeHtml(str){
        if (!str) return '';
        return String(str).replace(/[&<>\"]/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'})[c];});
      }

      renderList();
    });
  </script>
</body>
</html>
