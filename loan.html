<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request Loan</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
  <h2>💳 Fast &amp; Reliable Bank</h2>
  <div style="display:flex;align-items:center;gap:8px;">
    <img id="userAvatar" class="avatar" alt="Profile" style="display:none" src="">
    <span id="userDisplay"></span>
    <a class="interfaces-link" href="interfaces.html" title="All Interfaces" aria-label="All Interfaces" style="margin-left:8px;text-decoration:none;display:inline-flex;align-items:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M12 7l3 2-2 3-3-2 2-3z" fill="currentColor"/>
      </svg>
    </a>
  </div>
  </header>

  <main class="center">
    <section>
      <h2>Request Loan</h2>
      <input id="loan_amount" type="number" placeholder="Amount requested">
      <select id="loan_term">
        <option value="3 months">3 months</option>
        <option value="6 months">6 months</option>
        <option value="12 months">12 months</option>
      </select>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
        <button id="btnLoan">Request Loan</button>
      </div>
      <p style="text-align:center;margin-top:12px"><a href="index.html">← Back</a></p>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.checkAuth) window.checkAuth();
      if (window.loadUser) window.loadUser();
      if (window.loadProfile) window.loadProfile();
      document.getElementById('btnLoan')?.addEventListener('click', () => window.requestLoan && window.requestLoan());
    });
  </script>
</body>
</html>
