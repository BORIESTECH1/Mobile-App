        <script>
            // Animated bottom nav indicator
            (function(){
                const nav = document.getElementById('bottomNav');
                if (!nav) return;
                const items = Array.from(nav.querySelectorAll('.nav-item'));
                const indicator = nav.querySelector('.nav-indicator');

                function placeIndicator(el, immediate){
                    if (!el || !indicator) return;
                    const navRect = nav.getBoundingClientRect();
                    const elRect = el.getBoundingClientRect();
                    const width = Math.max(48, Math.min(84, elRect.width - 8));
                    const left = elRect.left - navRect.left + (elRect.width - width)/2;
                    indicator.style.width = width + 'px';
                    indicator.style.transform = `translateX(${left}px)`;
                    if (immediate) indicator.style.transition = 'none';
                    else indicator.style.transition = '';
                }

                // initial placement on active or first item
                const active = nav.querySelector('.nav-item.active') || items[0];
                placeIndicator(active, true);

                // move on click/focus
                items.forEach(it => {
                    it.addEventListener('click', (e) => {
                        // allow navigation but animate immediately for feel
                        items.forEach(x=>x.classList.remove('active'));
                        it.classList.add('active');
                        placeIndicator(it, false);
                        // ripple effect
                        const r = document.createElement('span'); r.className='ripple'; it.appendChild(r);
                        setTimeout(()=>r.remove(),600);
                    });
                    it.addEventListener('focus', ()=> placeIndicator(it, false));
                });

                // reposition on resize
                window.addEventListener('resize', ()=> placeIndicator(nav.querySelector('.nav-item.active') || items[0], true));
            })();
        </script>

    <script>
        // initialize user display after DOM loads
        document.addEventListener('DOMContentLoaded', () => {
            if (window.checkAuth) window.checkAuth(false); // do not redirect automatically
            if (window.loadUser) window.loadUser();
            if (window.loadProfile) window.loadProfile();
            document.getElementById('btnToggleBalance')?.addEventListener('click', () => window.toggleBalance && window.toggleBalance());
            // render recent activity on the dashboard
            try {
                const list = document.getElementById('activityList');
                if (list && window.renderRecentActivity) window.renderRecentActivity(list);
            } catch (e) { console.error('activity render failed', e); }
        });
    </script>
